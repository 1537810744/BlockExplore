# ============================================================
# BlockExplore Nginx 配置
# 功能：反向代理、负载均衡、限流、静态缓存
# ============================================================

# 定义限流区域
# 每个 IP 地址每秒最多 10 个请求，突发容量 20 个
# zone=api_limit:10m 表示分配 10MB 内存存储限流状态
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# 上游服务定义（微服务地址）
# Nginx 将请求代理到这些服务

# 查询 API 服务
upstream query_api {
    server query-api:8080;      # query-api 容器地址
    keepalive 32;               # 保持 32 个长连接
}

# 搜索 API 服务
upstream search_api {
    server search-api:8081;
    keepalive 16;
}

# 价格 API 服务
upstream price_api {
    server price-api:8082;
    keepalive 16;
}

# HTTP 服务器配置
server {
    listen 80;                  # 监听 80 端口
    server_name localhost;      # 服务器名称

    # ---------- 通用配置 ----------

    # 请求体大小限制
    client_max_body_size 10m;

    # 代理缓冲区设置
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 16k;

    # 代理超时设置
    proxy_connect_timeout 10s;  # 连接超时
    proxy_read_timeout 30s;     # 读取超时
    proxy_send_timeout 10s;     # 发送超时

    # ---------- 健康检查 ----------
    location /health {
        proxy_pass http://query_api/health;
        access_log off;         # 健康检查不记录日志
    }

    # ---------- API 路由 ----------

    # 查询 API: /api/v1/blocks, /api/v1/transactions, /api/v1/addresses
    location /api/v1/blocks {
        limit_req zone=api_limit burst=20 nodelay;  # 应用限流
        proxy_pass http://query_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/v1/transactions {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://query_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/v1/addresses {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://query_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # 搜索 API: /api/v1/search
    location /api/v1/search {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://search_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # 价格 API: /api/v1/price
    location /api/v1/price {
        limit_req zone=api_limit burst=30 nodelay;  # 价格查询限流宽松些
        proxy_pass http://price_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # ---------- 错误页面 ----------
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
