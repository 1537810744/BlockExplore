name: CI

# 触发条件：推送到 main 或创建 PR
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ==================== Job 1: 代码质量检查 ====================
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

      - name: go vet
        run: go vet ./...

  # ==================== Job 2: 单元测试 + 覆盖率 ====================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Run unit tests (exclude integration)
        run: go test -v -coverprofile=coverage.out -covermode=atomic -run=XXX_NONE ./...

      - name: Show coverage
        run: |
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ==================== Job 3: 编译验证 ====================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build all 7 services
        run: |
          mkdir -p bin
          go build -ldflags="-s -w" -o bin/query-api       ./cmd/query-api/
          go build -ldflags="-s -w" -o bin/search-api      ./cmd/search-api/
          go build -ldflags="-s -w" -o bin/price-api       ./cmd/price-api/
          go build -ldflags="-s -w" -o bin/eth-sync-worker ./cmd/eth-sync-worker/
          go build -ldflags="-s -w" -o bin/btc-sync-worker ./cmd/btc-sync-worker/
          go build -ldflags="-s -w" -o bin/sol-sync-worker ./cmd/sol-sync-worker/
          go build -ldflags="-s -w" -o bin/block-processor ./cmd/block-processor/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  # ==================== Job 4: 集成测试（需真实 PG/Redis） ====================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: blockexplore
          POSTGRES_PASSWORD: blockexplore123
          POSTGRES_DB: blockexplore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Run integration tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
        run: go test -v -tags=integration ./internal/repository/
