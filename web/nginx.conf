# ============================================================
# 前端 nginx 配置
# 提供静态文件服务 + API 反向代理
# ============================================================

server {
    listen 80;
    server_name localhost;

    # 静态文件
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 搜索 API（search-api:8081）
    location /api/v1/search {
        proxy_pass http://search-api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 价格 API（price-api:8082）
    location /api/v1/price/ {
        proxy_pass http://price-api:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 其他 API（query-api:8080）
    location /api/ {
        proxy_pass http://query-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
